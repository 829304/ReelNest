name: reelnest
description: ReelNest cross-platform media library client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  drift: ^2.35.1
  file_selector: ^1.1.0
  path: ^1.9.1
  characters: ^1.4.1
  ffi: ^2.2.0
  win32: ^6.4.0
  path_provider: ^2.1.5
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  desktop_multi_window: 0.3.1
  window_manager: 0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
