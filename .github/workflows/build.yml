name: Platform builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-2025
            command: flutter build windows --release
            artifact: apps/client/build/windows/x64/runner/Release/
          - target: linux
            os: ubuntu-24.04
            command: flutter build linux --release
            artifact: apps/client/build/reelnest-linux.tar.gz
          - target: macos
            os: macos-15
            command: flutter build macos --release
            artifact: apps/client/build/reelnest-macos.tar.gz
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-flutter
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get --enforce-lockfile
      - run: ${{ matrix.command }}
      - if: matrix.target == 'linux'
        run: tar -czf build/reelnest-linux.tar.gz -C build/linux/x64/release/bundle .
      - if: matrix.target == 'macos'
        run: tar -czf build/reelnest-macos.tar.gz -C build/macos/Build/Products/Release ReelNest.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reelnest-${{ matrix.target }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
